title = "Lab orchestrator secrets policy"


[extend]
useDefault = true




[allowlist]
description = "Hackathon-provided context files (not application secrets)"
paths = [
    '''stends_info/''',
    '''stends_info/.*''',
    '''gerik_temp/''',
    '''gerik_temp/.*''',
    '''backend/test\.db''',
    '''.*\.gitkeep''',

    '''backend/tests?/.*''',
]



regexes = [
    '''hackhaton_team\d+''',
]




