---
- name: "Lab 3 - проверка имени L-MS"
  hosts: lms
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: "1.1 Hostname точно соответствует роли в домене cyberprotect.test"
      ansible.builtin.command: hostname
      register: hostname_out
      changed_when: false
      failed_when: (hostname_out.stdout | trim | lower) != (expected_hostname | lower)
      tags: [hostname]

- name: "Lab 3 - проверка сервера управления L-MS"
  hosts: lms
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: "2.1 Порт веб-консоли 9877 слушает на L-MS"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9877
        state: started
        timeout: 8
      tags: [management, web]

- name: "Lab 3 - проверка узла хранения W-DC"
  hosts: wdc
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: "2.2 Требуемые Windows-службы запущены на W-DC"
      ansible.builtin.raw: |
        $required = @('Storage Node', 'Catalog Browser', 'Elasticsearch')
        $running = @(Get-Service | Where-Object { $_.Status -eq 'Running' } | ForEach-Object { $_.DisplayName })
        $missing = @()
        foreach ($expected in $required) {
          if (-not ($running -match [regex]::Escape($expected))) { $missing += $expected }
        }
        if ($missing.Count -gt 0) {
          Write-Error ('Не запущены службы: ' + ($missing -join ', '))
          exit 1
        }
        Write-Output ($running -join "`n")
      changed_when: false
      tags: [windows, services]

    - name: "2.3 Каталог управляемого хранилища C:\\Backups существует на W-DC"
      ansible.builtin.raw: |
        if (-not (Test-Path -LiteralPath 'C:\Backups' -PathType Container)) {
          Write-Error 'Каталог C:\Backups не найден'
          exit 1
        }
      changed_when: false
      tags: [windows, storage]

- name: "Lab 3 - структурированный итог"
  hosts: lms:wdc
  gather_facts: false
  tasks:
    - name: "4.1 Машина доступна для автоматической проверки"
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          expected_hostname: "{{ expected_hostname }}"
