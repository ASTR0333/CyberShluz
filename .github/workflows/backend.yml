name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.1.8

      - name: Ruff check
        run: ruff check app/ --output-format=github

  security:
    name: Security scan (bandit + secrets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "pbr>=5.11" "stevedore>=5.1" "bandit[toml]==1.7.10"

      - name: Bandit static analysis
        run: bandit -r app/ -ll --skip B101,B404,B603,B607 -f txt

      - name: Gitleaks (secrets scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks



          /tmp/gitleaks detect \
            --no-banner --redact --verbose \
            --no-git \
            --source ../ \
            --config ../.gitleaks.toml \
            --report-format json \
            --report-path /tmp/gitleaks.json \
            --exit-code 1 || {
              echo "::group::Gitleaks findings"
              cat /tmp/gitleaks.json || true
              echo "::endgroup::"
              exit 1
            }

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: lab-orchestrator-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user in container
        run: |
          UID_IN=$(docker run --rm --entrypoint id lab-orchestrator-backend:ci -u)
          echo "Container UID: $UID_IN"
          if [ "$UID_IN" = "0" ]; then
            echo "::error::Container runs as root (uid 0). DevSecOps standard requires non-root."
            exit 1
          fi

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy image scan (HIGH/CRITICAL)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --timeout 5m \
            lab-orchestrator-backend:ci

  deploy:
    name: Deploy Backend + Workers
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from secret
        run: |
          umask 077
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

          sed -i 's/\r$//' .env

      - name: Ensure ssh_keys/ owned by UID 1000
        run: |
          mkdir -p ssh_keys
          sudo chown -R 1000:1000 ssh_keys
          sudo chmod 700 ssh_keys

      - name: Deploy stack
        run: |
          docker compose pull db redis || true

          docker compose up -d db redis
          docker compose up -d --build backend celery_worker celery_beat

      - name: Wait for backend healthcheck
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -fs http://localhost:8000/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy in time"
          docker compose logs backend | tail -n 100
          exit 1

      - name: Refresh nginx-proxy upstream
        run: docker compose up -d --force-recreate nginx-proxy
