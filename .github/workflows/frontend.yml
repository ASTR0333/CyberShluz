name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Production build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: lab-orchestrator-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user in container
        run: |
          UID_IN=$(docker run --rm --entrypoint id lab-orchestrator-frontend:ci -u)
          echo "Container UID: $UID_IN"
          if [ "$UID_IN" = "0" ]; then
            echo "::error::Frontend container runs as root (uid 0). Must be non-root."
            exit 1
          fi

  deploy:
    name: Deploy Frontend + Nginx
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from secret
        run: |
          umask 077
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
          sed -i 's/\r$//' .env

      - name: Deploy frontend
        run: |
          docker compose up -d --build frontend
          docker compose up -d --force-recreate nginx-proxy
