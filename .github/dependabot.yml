version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Helsinki
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Helsinki
    labels:
      - dependencies
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Helsinki
    labels:
      - dependencies
    open-pull-requests-limit: 5
