services:

  db:
    image: postgres:16-alpine
    container_name: hackathon_db
    environment:
      POSTGRES_DB: lab_orchestrator
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab_secret_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d lab_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always


  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: hackathon_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:rw
      - ./backend/requirements.txt:/app/requirements.txt:ro
      - ./ssh_keys:/app/ssh_keys:rw
      - ./ansible:/app/ansible:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3


  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: hackathon_celery_worker
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:rw
      - ./backend/requirements.txt:/app/requirements.txt:ro
      - ./ssh_keys:/app/ssh_keys:rw
      - ./ansible:/app/ansible:ro
    healthcheck:
      disable: true
    restart: unless-stopped


  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: hackathon_celery_beat
    command: celery -A app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:rw
      - ./ansible:/app/ansible:ro
      - celery_beat_schedule:/var/lib/celery
    healthcheck:
      disable: true
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    depends_on:
      - backend
    restart: always


  nginx-proxy:
    image: nginx:alpine
    container_name: hackathon_nginx_proxy
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  celery_beat_schedule:
