services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab_orchestrator
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d lab_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always


  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ssh_keys:/app/ssh_keys:rw
      - ./ansible:/app/ansible:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3


  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ssh_keys:/app/ssh_keys:rw
      - ./ansible:/app/ansible:ro
    healthcheck:
      disable: true
    restart: unless-stopped


  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql://lab_admin:${DB_PASSWORD:-lab_secret_123}@db:5432/lab_orchestrator
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ansible:/app/ansible:ro
      - celery_beat_schedule:/var/lib/celery
    healthcheck:
      disable: true
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always


  nginx-proxy:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always

volumes:
  postgres_data:
  celery_beat_schedule:
