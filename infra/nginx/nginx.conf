
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker can assign a new address to a recreated service container. Resolve
# service names at request time so a long-running proxy does not keep routing
# to the old address after `docker compose up --build`.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:8080;
    set $guacamole_upstream guacamole:8080;

    location = /rdp {
        return 302 /rdp/;
    }

    location /rdp/ {
        proxy_pass http://$guacamole_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;


        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /health {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
